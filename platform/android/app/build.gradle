plugins {
  id 'com.android.application'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
  localPropertiesFile.withInputStream { localProperties.load(it) }
}

def glyphProperty = { String name, String fallback = null ->
  def envName = name.replace('.', '_').toUpperCase(Locale.ROOT)
  return findProperty(name) ?: localProperties.getProperty(name) ?: System.getenv(envName) ?: fallback
}

def glyphCompileSdk = glyphProperty('glyph.compileSdk', '35') as Integer
def glyphTargetSdk = glyphProperty('glyph.targetSdk', glyphCompileSdk.toString()) as Integer
def glyphMinSdk = glyphProperty('glyph.minSdk', '23') as Integer
def glyphSdl2Root = glyphProperty('glyph.sdl2Root', '')
def glyphSdl2ImageRoot = glyphProperty('glyph.sdl2ImageRoot', '')
def glyphSdl2TtfRoot = glyphProperty('glyph.sdl2TtfRoot', '')
def glyphSdl2MixerRoot = glyphProperty('glyph.sdl2MixerRoot', '')
def glyphCmakeVersion = glyphProperty('glyph.cmakeVersion', null)
def glyphAbiFilters = glyphProperty('glyph.abiFilters', 'arm64-v8a,x86_64')
    .split(',')
    .collect { it.trim() }
    .findAll { !it.isEmpty() }
def sdlJniLibDirs = [
    file("${glyphSdl2Root}/android-project/app/src/main/jniLibs"),
    file("${glyphSdl2Root}/lib"),
    file("${glyphSdl2Root}/lib/android")
]
if (!glyphSdl2ImageRoot.isEmpty()) {
  sdlJniLibDirs += [
      file("${glyphSdl2ImageRoot}/android-project/app/src/main/jniLibs"),
      file("${glyphSdl2ImageRoot}/lib"),
      file("${glyphSdl2ImageRoot}/lib/android")
  ]
}
[glyphSdl2TtfRoot, glyphSdl2MixerRoot].findAll { !it.isEmpty() }.each { root ->
  sdlJniLibDirs += [file("${root}/lib"), file("${root}/lib/android"), file("${root}/android-project/app/src/main/jniLibs")]
}
sdlJniLibDirs = sdlJniLibDirs.findAll { it.exists() }

if (glyphSdl2Root.isEmpty()) {
  throw new GradleException(
      'Set glyph.sdl2Root in platform/android/local.properties or pass -Pglyph.sdl2Root=/path/to/SDL2.')
}

def sdl2RootFile = file(glyphSdl2Root)
def sdl2ImageRootFile = glyphSdl2ImageRoot.isEmpty() ? null : file(glyphSdl2ImageRoot)
def sdl2JavaDir = file("${glyphSdl2Root}/android-project/app/src/main/java")
if (!sdl2RootFile.exists()) {
  throw new GradleException("glyph.sdl2Root does not exist: ${sdl2RootFile}")
}
if (sdl2ImageRootFile != null && !sdl2ImageRootFile.exists()) {
  throw new GradleException("glyph.sdl2ImageRoot does not exist: ${sdl2ImageRootFile}")
}
if (!sdl2JavaDir.exists()) {
  throw new GradleException(
      "SDLActivity Java sources not found under ${sdl2JavaDir}. Use an SDL2 Android source checkout.")
}

def generatedGlyphAssets = layout.buildDirectory.dir('generated/glyphAssets')

tasks.register('syncGlyphArcadeAssets', Sync) {
  from(rootProject.file('../../examples/arcade')) {
    exclude '.DS_Store'
  }
  into(generatedGlyphAssets.map { it.dir('examples/arcade') })
}

android {
  namespace 'com.glyph.runtime'
  compileSdk glyphCompileSdk

  defaultConfig {
    applicationId 'com.glyph.runtime'
    minSdk glyphMinSdk
    targetSdk glyphTargetSdk
    versionCode 1
    versionName '0.1.0'

    ndk {
      abiFilters.addAll(glyphAbiFilters)
    }

    externalNativeBuild {
      cmake {
        arguments "-DGLYPH_ANDROID_SDL2_ROOT=${sdl2RootFile.absolutePath}",
            "-DGLYPH_ANDROID_SDL2_IMAGE_ROOT=${sdl2ImageRootFile == null ? '' : sdl2ImageRootFile.absolutePath}",
            "-DGLYPH_ANDROID_SDL2_TTF_ROOT=${glyphSdl2TtfRoot}",
            "-DGLYPH_ANDROID_SDL2_MIXER_ROOT=${glyphSdl2MixerRoot}",
            "-DGLYPH_REQUIRE_MEDIA=${glyphProperty('glyph.requireMedia', 'ON')}",
            '-DANDROID_STL=c++_shared'
        cppFlags '-std=c++20 -fexceptions -frtti'
        targets 'glyph'
      }
    }
  }

  sourceSets {
    main {
      java.srcDirs += sdl2JavaDir
      assets.srcDirs += generatedGlyphAssets.get().asFile
      jniLibs.srcDirs += sdlJniLibDirs
    }
  }

  externalNativeBuild {
    cmake {
      path file('../../../CMakeLists.txt')
      if (glyphCmakeVersion != null && !glyphCmakeVersion.isEmpty()) {
        version glyphCmakeVersion
      }
    }
  }

  packaging {
    jniLibs {
      useLegacyPackaging = true
    }
  }
}

tasks.configureEach { task ->
  if (task.name.startsWith('merge') && task.name.endsWith('Assets')) {
    task.dependsOn(tasks.named('syncGlyphArcadeAssets'))
  }
}
